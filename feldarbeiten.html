<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Feldarbeiten</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial}.app{max-width:800px;margin:auto;padding:22px 16px 80px}h1{text-align:center;font-family:Georgia;font-size:38px}.card{background:#111;border:1px solid #008000;border-radius:18px;padding:19px;margin-bottom:17px}.titel{color:#00ff22;font-size:24px;font-weight:bold}.meta{color:#ffaa33;line-height:1.5;margin:8px 0}.info,.arbeiten{line-height:1.55}.arbeiten{background:#090909;border-radius:12px;padding:13px;margin:13px 0}.preis{font-size:22px;color:#00ff22;font-weight:bold}.status{display:inline-block;border-radius:20px;padding:7px 12px;font-weight:bold;margin:8px 0}.offen{background:#cc7700}.bestaetigt{background:#008800}.abgelehnt{background:#aa0000}.btn{width:100%;padding:16px;border:0;border-radius:13px;color:#fff;font-size:18px;font-weight:bold;margin-top:10px;background:#009900}.red{background:#aa0000}.dark{background:#333}.blue{background:#07549a}.grid,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{margin-bottom:18px}.msg{color:#ffaa33;text-align:center;white-space:pre-line}.leer{text-align:center;color:#aaa;padding:30px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><button class="btn dark" onclick="location.href='felder.html'">← Zurück</button><h1>FELDARBEITEN</h1><div class="tabs"><button class="btn blue" onclick="location.href='feldarbeit_erstellen.html'">Neue Feldarbeit</button><button class="btn dark" onclick="laden()">Aktualisieren</button></div><div id="kopf" class="card">Lade …</div><div id="liste"></div><div id="msg" class="msg"></div></div><script>
const SUPABASE_URL="https://iddfyhsxsdjgestwxcei.supabase.co",SUPABASE_KEY="sb_publishable_j0vVUcU3niZMXL4loB6QWQ_bWg0mloR",USER_ID=localStorage.getItem("user_id");if(!USER_ID)location.href="login.html";let users=[],hoefe=[],felder=[],arbeiten=[],user=null;function headers(){return{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"}}async function api(t){const r=await fetch(SUPABASE_URL+"/rest/v1/"+t+"?select=*",{headers:headers(),cache:"no-store"});if(!r.ok)throw new Error(await r.text());return r.json()}async function post(t,d){const r=await fetch(SUPABASE_URL+"/rest/v1/"+t,{method:"POST",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()}async function patch(t,id,d){const r=await fetch(SUPABASE_URL+"/rest/v1/"+t+"?id=eq."+id,{method:"PATCH",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()}function text(v){return v===null||v===undefined||v===""?"-":v}function hofName(id){const h=hoefe.find(x=>String(x.id)===String(id));return h?h.Name:"Hof "+id}function euro(v){return Number(v||0).toLocaleString("de-AT")+" €"}function chatId(u){return u.Telegram_id||u.Telegram_chat_id||u["Telegram Chat ID"]||u.Chat_id||null}function empfaenger(id){return users.filter(u=>u.Aktiviert!==false&&String(u.Hof_id)===String(id)&&chatId(u))}async function benachrichtigen(h,t,n){await post("Benachrichtigungen",{Titel:t,Nachricht:n,Typ:"Feldarbeit",User_id:null,Hof_id:Number(h),Organisation_id:null,Gelesen:false,Archiviert:false,Erledigt:false,Telegram_gesendet:false,Erstellt_am:new Date().toISOString()});for(const u of empfaenger(h))await post("Telegram_queue",{Titel:t,Nachricht:n,Typ:"Feldarbeit",User_id:Number(u.id),Hof_id:Number(h),Organisation_id:null,Chat_id:Number(chatId(u)),Gesendet:false,Erstellt_am:new Date().toISOString(),Status:"Offen",Fehler:null})}function arbeitText(a){const x=[];if(a.Gepfluegt)x.push("✅ Gepflügt");if(a.Steine_gesammelt)x.push("✅ Steine gesammelt");if(a.Gekalkt)x.push("✅ Gekalkt");if(a.Gesaet)x.push("✅ Gesät: "+text(a.Fruchtart));if(a.Gewalzt)x.push("✅ Gewalzt");if(a.Geduengt_1x)x.push("✅ 1. Düngung");if(a.Geduengt_2x)x.push("✅ 2. Düngung");return x.join("<br>")}function klasse(s){return s==="Bestätigt"?"bestaetigt":s==="Abgelehnt"?"abgelehnt":"offen"}function serverdatum(a){return `Jahr ${a.Server_Jahr} · ${a.Server_Monat} · Tag ${a.Server_Tag} · ${a.Server_Zeit||"-"} Uhr`}
async function uebernehmen(a){const f=felder.find(x=>String(x.id)===String(a.Feld_id));if(!f)throw new Error("Feld nicht gefunden.");const d={Letzte_Aktion:"Fremdarbeit bestätigt"};if(a.Gepfluegt){Object.assign(d,{Gepfluegt:true,Gepfluegt_Serverjahr:a.Server_Jahr,Gepfluegt_Servermonat:a.Server_Monat,Gepfluegt_Servertag:a.Server_Tag,Gepfluegt_Serverzeit:a.Server_Zeit,Steine_sammeln_noetig:true})}if(a.Steine_gesammelt)d.Steine_sammeln_noetig=false;if(a.Gekalkt)Object.assign(d,{Gekalkt:true,Gekalkt_Serverjahr:a.Server_Jahr,Gekalkt_Servermonat:a.Server_Monat,Gekalkt_Servertag:a.Server_Tag,Gekalkt_Serverzeit:a.Server_Zeit});if(a.Gesaet)Object.assign(d,{Gesaet:true,Fruchtart:a.Fruchtart,Gesaet_Serverjahr:a.Server_Jahr,Gesaet_Servermonat:a.Server_Monat,Gesaet_Servertag:a.Server_Tag,Gesaet_Serverzeit:a.Server_Zeit,Erntebereit:false,Ernte_Benachrichtigt:false,Walzen_noetig:!a.Gewalzt,Gewalzt:a.Gewalzt===true,Geduengt_1x:false,Geduengt_2x:false,"Duengen_nötig":true});if(a.Gewalzt)Object.assign(d,{Gewalzt:true,Walzen_noetig:false,Gewalzt_Serverjahr:a.Server_Jahr,Gewalzt_Servermonat:a.Server_Monat,Gewalzt_Servertag:a.Server_Tag,Gewalzt_Serverzeit:a.Server_Zeit});if(a.Geduengt_1x)Object.assign(d,{Geduengt_1x:true,Geduengt1_Serverjahr:a.Server_Jahr,Geduengt1_Servermonat:a.Server_Monat,Geduengt1_Servertag:a.Server_Tag,Geduengt1_Serverzeit:a.Server_Zeit,"Duengen_nötig":false});if(a.Geduengt_2x)Object.assign(d,{Geduengt_2x:true,Geduengt2_Serverjahr:a.Server_Jahr,Geduengt2_Servermonat:a.Server_Monat,Geduengt2_Servertag:a.Server_Tag,Geduengt2_Serverzeit:a.Server_Zeit,"Duengen_nötig":false});await patch("Felder",f.id,d)}
async function rechnung(a){if(Number(a.Gesamtpreis||0)<=0)return null;const r=await post("Rechnungen",{Rechnung_nr:"FA-"+a.id+"-J"+a.Server_Jahr,Von_Hof_id:Number(a.Ausfuehrender_Hof_id),An_Hof_id:Number(a.Besitzer_Hof_id),Produkt:"Feldarbeit Feld "+a.Feldnummer,Menge:1,Einheit:"Pauschale",Einzelpreis:Number(a.Gesamtpreis),Gesamtpreis:Number(a.Gesamtpreis),Bemerkung:(a.Materialien?"Materialien: "+a.Materialien+"\n":"")+(a.Bemerkung||""),Bezahlt:false,Storniert:false,Status:"Offen",Erstellt_von:"Feldarbeit-Automatik",Server_Jahr:a.Server_Jahr,Server_Monat:a.Server_Monat,Server_Tag:a.Server_Tag});return r&&r[0]?r[0].id:null}
async function bestaetigen(id){const a=arbeiten.find(x=>Number(x.id)===Number(id));if(!a||!confirm("Bestätigen und Feld übernehmen?"))return;try{await uebernehmen(a);const rid=await rechnung(a);await patch("Feldarbeiten",a.id,{Status:"Bestätigt",Bestaetigt_am:new Date().toISOString(),Bestaetigt_von_User_id:Number(user.id),Feld_uebernommen:true,Rechnung_id:rid});await benachrichtigen(a.Ausfuehrender_Hof_id,"✅ Feldarbeit bestätigt",`${hofName(a.Besitzer_Hof_id)} hat Feld ${a.Feldnummer} bestätigt.${rid?" Die Rechnung wurde erstellt.":""}`);await laden()}catch(e){msg.innerText="Fehler:\n"+e.message}}async function ablehnen(id){const a=arbeiten.find(x=>Number(x.id)===Number(id));if(!a)return;const g=prompt("Ablehnungsgrund:");if(g===null)return;try{await patch("Feldarbeiten",a.id,{Status:"Abgelehnt",Ablehnungsgrund:g.trim()||null,Abgelehnt_am:new Date().toISOString(),Abgelehnt_von_User_id:Number(user.id)});await benachrichtigen(a.Ausfuehrender_Hof_id,"❌ Feldarbeit abgelehnt",`${hofName(a.Besitzer_Hof_id)} hat Feld ${a.Feldnummer} abgelehnt.${g?"\nGrund: "+g:""}`);await laden()}catch(e){msg.innerText="Fehler:\n"+e.message}}
function render(){const l=arbeiten.filter(a=>String(a.Besitzer_Hof_id)===String(user.Hof_id)||String(a.Ausfuehrender_Hof_id)===String(user.Hof_id)||user.Admin===true).sort((a,b)=>Number(b.id)-Number(a.id));if(!l.length){liste.innerHTML='<div class="leer">Keine Feldarbeiten vorhanden.</div>';return}liste.innerHTML=l.map(a=>{const darf=String(a.Besitzer_Hof_id)===String(user.Hof_id)||user.Admin===true;return `<div class="card"><div class="titel">Feld ${text(a.Feldnummer)}</div><div class="status ${klasse(a.Status)}">${text(a.Status)}</div><div class="meta">Von: ${hofName(a.Ausfuehrender_Hof_id)}<br>Für: ${hofName(a.Besitzer_Hof_id)}<br>Ausstellungszeit: ${serverdatum(a)}</div><div class="arbeiten">${arbeitText(a)}</div>${a.Materialien?`<div class="info"><b>Materialien:</b><br>${text(a.Materialien)}</div>`:""}${a.Bemerkung?`<div class="info"><b>Bemerkung:</b><br>${text(a.Bemerkung)}</div>`:""}<div class="info">Arbeitskosten: ${euro(a.Arbeitskosten)}<br>Materialkosten: ${euro(a.Materialkosten)}</div><div class="preis">Gesamt: ${euro(a.Gesamtpreis)}</div>${a.Ablehnungsgrund?`<div class="meta">Ablehnungsgrund: ${text(a.Ablehnungsgrund)}</div>`:""}${darf&&a.Status==="Wartet auf Bestätigung"?`<div class="grid"><button class="btn" onclick="bestaetigen(${a.id})">Bestätigen</button><button class="btn red" onclick="ablehnen(${a.id})">Ablehnen</button></div>`:""}</div>`}).join("")}
async function laden(){msg.innerText="";try{[users,hoefe,felder,arbeiten]=await Promise.all([api("Users"),api("Hoefe"),api("Felder"),api("Feldarbeiten")]);user=users.find(u=>String(u.id)===String(USER_ID));if(!user)throw new Error("Benutzer nicht gefunden.");kopf.innerHTML=`<div class="titel">${hofName(user.Hof_id)}</div><div class="info">Nur der Besitzerhof oder ein Admin kann bestätigen.</div>`;render()}catch(e){kopf.innerHTML="Fehler:<br>"+e.message}}laden();
</script></body></html>

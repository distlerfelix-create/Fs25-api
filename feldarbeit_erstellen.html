<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Feldarbeit melden</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial}.app{max-width:760px;margin:auto;padding:22px 16px 80px}h1{text-align:center;font-family:Georgia;font-size:38px}.card{background:#111;border:1px solid #008000;border-radius:18px;padding:20px;margin-bottom:18px}h2{color:#00ff22}.label{display:block;color:#ffaa33;font-weight:bold;margin:16px 0 7px}select,input,textarea{width:100%;padding:15px;border-radius:12px;border:1px solid #008000;background:#000;color:#fff;font-size:17px}textarea{min-height:105px}.check{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #2a2a2a;font-size:18px}.check input{width:28px;height:28px}.hidden{display:none}.btn{width:100%;padding:17px;border:0;border-radius:14px;background:#009900;color:#fff;font-size:19px;font-weight:bold;margin-top:14px}.dark{background:#333}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summe{font-size:25px;color:#00ff22;font-weight:bold;margin-top:15px}.server,.msg{color:#ffaa33}.msg{text-align:center;white-space:pre-line;margin-top:14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><button class="btn dark" onclick="location.href='felder.html'">← Zurück</button><h1>FELDARBEIT MELDEN</h1><div id="kopf" class="card">Lade …</div><div id="formular" class="hidden"><div class="card"><h2>Fremdes Feld auswählen</h2><label class="label">Besitzer-Hof</label><select id="zielHof" onchange="felderLaden()"></select><label class="label">Feld</label><select id="feld"></select></div><div class="card"><h2>Ausgeführte Arbeiten</h2><label class="check">Gepflügt<input id="gepfluegt" type="checkbox"></label><label class="check">Steine gesammelt<input id="steine" type="checkbox"></label><label class="check">Gekalkt<input id="gekalkt" type="checkbox"></label><label class="check">Gesät<input id="gesaet" type="checkbox" onchange="saatAnzeige()"></label><div id="fruchtBox" class="hidden"><label class="label">Gesäte Fruchtart</label><select id="fruchtart"></select></div><label class="check">Gewalzt<input id="gewalzt" type="checkbox"></label><label class="check">1. Düngung<input id="duengung1" type="checkbox"></label><label class="check">2. Düngung<input id="duengung2" type="checkbox"></label></div><div class="card"><h2>Material und Preis</h2><label class="label">Benötigte/verwendete Materialien</label><textarea id="materialien" placeholder="z. B. 12.000 l Kalk, 2.500 l Dünger …"></textarea><div class="grid"><div><label class="label">Arbeitskosten (€)</label><input id="arbeitskosten" type="number" min="0" step="100" value="0" oninput="summe()"></div><div><label class="label">Materialkosten (€)</label><input id="materialkosten" type="number" min="0" step="100" value="0" oninput="summe()"></div></div><label class="label">Bemerkung</label><textarea id="bemerkung"></textarea><div class="summe">Gesamtpreis: <span id="gesamt">0 €</span></div><div id="serverzeit" class="server"></div><button class="btn" onclick="erstellen()">Zur Bestätigung senden</button><div id="msg" class="msg"></div></div></div></div><script>
const SUPABASE_URL="https://iddfyhsxsdjgestwxcei.supabase.co",SUPABASE_KEY="sb_publishable_j0vVUcU3niZMXL4loB6QWQ_bWg0mloR",USER_ID=localStorage.getItem("user_id");if(!USER_ID)location.href="login.html";let users=[],hoefe=[],felder=[],fruchtarten=[],user=null,status=null;
function headers(){return{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"}}async function api(t){const r=await fetch(SUPABASE_URL+"/rest/v1/"+t+"?select=*",{headers:headers(),cache:"no-store"});if(!r.ok)throw new Error(await r.text());return r.json()}async function post(t,d){const r=await fetch(SUPABASE_URL+"/rest/v1/"+t,{method:"POST",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()}function text(v){return v===null||v===undefined||v===""?"-":v}function hofName(id){const h=hoefe.find(x=>String(x.id)===String(id));return h?h.Name:"Hof "+id}function chatId(u){return u.Telegram_id||u.Telegram_chat_id||u["Telegram Chat ID"]||u.Chat_id||null}function euro(v){return Number(v||0).toLocaleString("de-AT")+" €"}function betrag(id){return Math.max(0,Number(document.getElementById(id).value||0))}function summe(){document.getElementById("gesamt").innerText=euro(betrag("arbeitskosten")+betrag("materialkosten"))}function saatAnzeige(){document.getElementById("fruchtBox").classList.toggle("hidden",!document.getElementById("gesaet").checked)}function empfaenger(hofId){return users.filter(u=>u.Aktiviert!==false&&String(u.Hof_id)===String(hofId)&&chatId(u))}
async function benachrichtigen(hofId,titel,nachricht){await post("Benachrichtigungen",{Titel:titel,Nachricht:nachricht,Typ:"Feldarbeit",User_id:null,Hof_id:Number(hofId),Organisation_id:null,Gelesen:false,Archiviert:false,Erledigt:false,Telegram_gesendet:false,Erstellt_am:new Date().toISOString()});for(const u of empfaenger(hofId))await post("Telegram_queue",{Titel:titel,Nachricht:nachricht,Typ:"Feldarbeit",User_id:Number(u.id),Hof_id:Number(hofId),Organisation_id:null,Chat_id:Number(chatId(u)),Gesendet:false,Erstellt_am:new Date().toISOString(),Status:"Offen",Fehler:null})}
function felderLaden(){const id=document.getElementById("zielHof").value;const l=felder.filter(f=>String(f.Hof_id)===String(id)).sort((a,b)=>Number(a.Feldnummer)-Number(b.Feldnummer));document.getElementById("feld").innerHTML=l.map(f=>`<option value="${f.id}">Feld ${text(f.Feldnummer)} · ${text(f.Feldgroesse)} ha · ${text(f.Fruchtart)}</option>`).join("")}
async function laden(){try{[users,hoefe,felder,fruchtarten]=await Promise.all([api("Users"),api("Hoefe"),api("Felder"),api("Fruchtarten")]);const ss=await api("Serverstatus");status=ss.find(s=>Number(s.id)===1)||ss[0];user=users.find(u=>String(u.id)===String(USER_ID));if(!user||!user.Hof_id)throw new Error("Du bist keinem Hof zugeordnet.");document.getElementById("kopf").innerHTML=`<h2>Ausführender Hof</h2><b>${hofName(user.Hof_id)}</b><br>Angemeldet als ${text(user.Vorname||user["PSN-Username"])}`;document.getElementById("zielHof").innerHTML=hoefe.filter(h=>String(h.id)!==String(user.Hof_id)).map(h=>`<option value="${h.id}">${h.Name}</option>`).join("");document.getElementById("fruchtart").innerHTML=fruchtarten.map(f=>`<option value="${f.Name||f.Fruchtart}">${f.Name||f.Fruchtart}</option>`).join("");document.getElementById("serverzeit").innerText=`Ausstellungszeit: Jahr ${status.jahr} · ${status.monat} · Tag ${status.tag} · ${status.zeit||"-"} Uhr`;felderLaden();document.getElementById("formular").classList.remove("hidden")}catch(e){document.getElementById("kopf").innerHTML="Fehler:<br>"+e.message}}
async function erstellen(){const msg=document.getElementById("msg");msg.innerText="";const feld=felder.find(f=>String(f.id)===String(document.getElementById("feld").value));if(!feld){msg.innerText="Bitte Feld auswählen.";return}const a={Gepfluegt:gepfluegt.checked,Steine_gesammelt:steine.checked,Gekalkt:gekalkt.checked,Gesaet:gesaet.checked,Gewalzt:gewalzt.checked,Geduengt_1x:duengung1.checked,Geduengt_2x:duengung2.checked};if(!Object.values(a).some(Boolean)){msg.innerText="Bitte mindestens eine Arbeit auswählen.";return}try{const gesamt=betrag("arbeitskosten")+betrag("materialkosten");const d={Feld_id:Number(feld.id),Feldnummer:String(feld.Feldnummer||feld.id),Ausfuehrender_Hof_id:Number(user.Hof_id),Besitzer_Hof_id:Number(feld.Hof_id),Erstellt_von_User_id:Number(user.id),...a,Fruchtart:a.Gesaet?fruchtart.value:null,Materialien:materialien.value.trim()||null,Arbeitskosten:betrag("arbeitskosten"),Materialkosten:betrag("materialkosten"),Gesamtpreis:gesamt,Bemerkung:bemerkung.value.trim()||null,Status:"Wartet auf Bestätigung",Server_Jahr:Number(status.jahr),Server_Monat:status.monat,Server_Tag:Number(status.tag),Server_Zeit:status.zeit||null};await post("Feldarbeiten",d);await benachrichtigen(feld.Hof_id,"🚜 Feldarbeit zur Bestätigung",`${hofName(user.Hof_id)} meldet Arbeiten auf Feld ${d.Feldnummer}.\nGesamtpreis: ${euro(gesamt)}\nAusstellungszeit: Jahr ${d.Server_Jahr} · ${d.Server_Monat} · Tag ${d.Server_Tag} · ${d.Server_Zeit||"-"} Uhr\nBitte in „Feldarbeiten“ bestätigen oder ablehnen.`);msg.innerText="Feldarbeit wurde gesendet.";setTimeout(()=>location.href="feldarbeiten.html",1000)}catch(e){msg.innerText="Fehler:\n"+e.message}}
laden();
</script></body></html>
